[project]
name = "square-madness"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "bokeh>=3.9.0",
    "google-auth>=2.49.1",
    "google-auth-oauthlib>=1.3.0",
    "gspread>=6.2.1",
    "jsonargparse>=4.47.0",
    "kaggle>=2.0.0",
    "pandas>=3.0.1",
]

[project.scripts]
download-scores = "square_madness.scripts.download_scores:cli"
download-squares = "square_madness.scripts.download_squares:cli"
update-app = "square_madness.scripts.update_app:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/square_madness"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
