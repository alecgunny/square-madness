name: Update Grid

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7-23 * * 4"  # Thu 00:00-16:00 PDT
    - cron: "0 * * * 5"     # Thu 17:00 - Fri 16:00 PDT
    - cron: "0 * * * 6"     # Fri 17:00 - Sat 16:00 PDT
    - cron: "0 * * * 0"     # Sat 17:00 - Sun 16:00 PDT
    - cron: "0 0-6 * * 1"   # Sun 17:00-23:00 PDT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Generate grid
        run: uv run update-app

      - name: Prepare deploy
        run: mkdir deploy && cp app.html deploy/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
